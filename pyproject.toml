[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jetson-hft-edge"
version = "1.0.0"
description = "Institutional Edge-Computed High-Frequency/Systematic Trading Platform for NVIDIA Jetson Orin (JetPack 6.x)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Principal Quantitative Systems Engineering"}
]
dependencies = [
    "pyzmq>=25.1.2",
    "websockets>=12.0",
    "aiohttp>=3.9.3",
    "cryptography>=42.0.5",
    "PyJWT>=2.8.0",
    "numpy>=1.26.4",
    "pyyaml>=6.0.1",
    "msgpack>=1.0.8",
    "uvloop>=0.19.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
jetson = [
    "tensorrt>=10.0.0",
    "cuda-python>=12.3.0",
    "onnx>=1.15.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
